<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ownership Report — Tickets & PRs</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --line: #2a3a52;
      --ios: #5ac8fa;
      --android: #a4c639;
      --accent: #ff6b4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans Thai", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #243552 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin-bottom: 22px; font-size: 0.95rem; }
    .toolbar {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      margin-bottom: 18px;
    }
    input[type="search"] {
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 12px; min-width: 240px;
    }
    .month-picker { position: relative; display: inline-flex; align-items: center; }
    select {
      appearance: none; -webkit-appearance: none;
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 38px 10px 12px; min-width: 170px;
      cursor: pointer;
    }
    .month-picker::after {
      content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px;
      border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
      transform: translateY(-65%) rotate(45deg); pointer-events: none;
    }
    .pill {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 12px; color: var(--muted); font-size: 0.85rem;
    }
    .filters { display: inline-flex; gap: 10px; align-items: center; }
    .check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
    .check input { accent-color: var(--accent); }
    table {
      width: 100%; border-collapse: collapse; background: var(--panel);
      border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
    }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
    th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text); }
    th.sortable::after { content: " ↕"; opacity: 0.45; }
    th.sortable.asc::after { content: " ↑"; opacity: 1; }
    th.sortable.desc::after { content: " ↓"; opacity: 1; }
    .hidden-column { display: none; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .ios { color: var(--ios); font-weight: 600; }
    .android { color: var(--android); font-weight: 600; }
    .name { font-weight: 600; cursor: pointer; }
    .name:hover { color: var(--accent); }
    details {
      margin-top: 22px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 12px 14px;
    }
    details summary { cursor: pointer; color: var(--muted); }
    .ticket {
      padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem;
    }
    .ticket a { color: var(--ios); text-decoration: none; }
    .empty { color: var(--muted); padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Ownership Report</h1>
    <p class="sub">จำนวน ticket ที่ถือจริง (ไม่นับ QA) และ merged PR จาก 9 repo — แยก iOS / Android</p>
    <div class="toolbar">
      <label class="pill" for="month">เดือน</label>
      <span class="month-picker"><select id="month" aria-label="เลือกเดือน"></select></span>
      <span class="pill">Platform</span>
      <span class="filters">
        <label class="check"><input id="ios-filter" type="checkbox" value="ios" checked /> iOS</label>
        <label class="check"><input id="android-filter" type="checkbox" value="android" checked /> Android</label>
      </span>
      <input id="q" type="search" placeholder="ค้นชื่อ…" />
      <span class="pill" id="meta">loading…</span>
    </div>
    <table>
      <thead>
        <tr>
          <th class="sortable" data-key="name">Person</th>
          <th class="sortable num col-ios" data-key="tickets_ios">Tickets iOS</th>
          <th class="sortable num col-android" data-key="tickets_android">Tickets Android</th>
          <th class="sortable num" data-key="tickets_other">Tickets Other</th>
          <th class="sortable num col-ios" data-key="prs_ios">PRs iOS</th>
          <th class="sortable num col-android" data-key="prs_android">PRs Android</th>
          <th class="sortable num" data-key="prs_mobile">PRs Mobile</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <details id="drill" open>
      <summary>Ticket drill-down</summary>
      <div id="tickets" class="empty">เลือกชื่อในตาราง</div>
    </details>
    <details id="pr-drill" open>
      <summary>PR drill-down</summary>
      <div id="prs" class="empty">เลือกชื่อในตาราง</div>
    </details>
  </main>
  <script>
    let report = null;
    let selected = null;
    let sortKey = "name";
    let sortDirection = 1;

    function renderRows(filter = "") {
      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      const needle = filter.trim().toLowerCase();
      const platforms = [...document.querySelectorAll(".filters input:checked")].map(input => input.value);
      const rows = (report.rows || []).filter(r => {
        const matchesText = !needle || r.name.toLowerCase().includes(needle);
        const matchesPlatform = !platforms.length || platforms.some(platform =>
          platform === "ios" ? (r.tickets_ios || 0) + (r.prs_ios || 0) > 0 :
          (r.tickets_android || 0) + (r.prs_android || 0) > 0
        );
        return matchesText && matchesPlatform;
      });
      rows.sort((a, b) => {
        const av = sortKey === "tickets_other" ? (a.tickets_unknown || 0) + (a.tickets_both || 0) : a[sortKey];
        const bv = sortKey === "tickets_other" ? (b.tickets_unknown || 0) + (b.tickets_both || 0) : b[sortKey];
        if (typeof av === "string") return sortDirection * av.localeCompare(bv, "th");
        return sortDirection * ((av || 0) - (bv || 0));
      });
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">ไม่มีข้อมูล</td></tr>`;
        return;
      }
      for (const r of rows) {
        const tr = document.createElement("tr");
        const other = (r.tickets_unknown || 0) + (r.tickets_both || 0);
        tr.innerHTML = `
          <td class="name">${escapeHtml(r.name)}</td>
          <td class="num ios col-ios">${r.tickets_ios}</td>
          <td class="num android col-android">${r.tickets_android}</td>
          <td class="num">${other}</td>
          <td class="num ios col-ios">${r.prs_ios}</td>
          <td class="num android col-android">${r.prs_android}</td>
          <td class="num">${r.prs_mobile || 0}</td>`;
        tr.querySelector(".name").addEventListener("click", () => {
          selected = r.name;
          renderTickets();
          renderPRs();
        });
        tbody.appendChild(tr);
      }
    }

    function renderTickets() {
      const box = document.getElementById("tickets");
      if (!selected) {
        box.className = "empty";
        box.textContent = "เลือกชื่อในตาราง";
        return;
      }
      const items = (report.ticket_details || []).filter(t => t.owner === selected && t.counted);
      if (!items.length) {
        box.className = "empty";
        box.textContent = `${selected}: ไม่มี ticket ในเดือนนี้`;
        return;
      }
      box.className = "";
      box.innerHTML = `<p class="sub">${escapeHtml(selected)} — ${items.length} tickets</p>` +
        items.map(t => `
          <div class="ticket">
            <a href="https://truedmp.atlassian.net/browse/${encodeURIComponent(t.key)}" target="_blank" rel="noopener">${escapeHtml(t.key)}</a>
            <span class="${t.platform === 'iOS' ? 'ios' : t.platform === 'Android' ? 'android' : ''}">[${escapeHtml(t.platform)}]</span>
            ${escapeHtml(t.summary)}
            <div class="sub">${escapeHtml(t.method)}${t.note ? " · " + escapeHtml(t.note) : ""}</div>
          </div>`).join("");
    }

    function renderPRs() {
      const box = document.getElementById("prs");
      if (!selected) { box.className = "empty"; box.textContent = "เลือกชื่อในตาราง"; return; }
      const row = (report.rows || []).find(r => r.name === selected);
      if (!row) return;
      box.className = "";
      box.innerHTML = `<p class="sub">${escapeHtml(selected)} — PR summary</p>
        <div class="ticket"><span class="ios">iOS: ${row.prs_ios || 0}</span> · <span class="android">Android: ${row.prs_android || 0}</span> · Mobile: ${row.prs_mobile || 0}</div>`;
    }

    function updateColumnVisibility() {
      const visible = new Set([...document.querySelectorAll(".filters input:checked")].map(input => input.value));
      document.querySelectorAll(".col-ios").forEach(cell => cell.classList.toggle("hidden-column", !visible.has("ios")));
      document.querySelectorAll(".col-android").forEach(cell => cell.classList.toggle("hidden-column", !visible.has("android")));
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      })[c]);
    }

    async function loadReport(file = "report.json") {
      const res = await fetch(`/data/${file}`, { cache: "no-store" });
      if (!res.ok) {
        document.getElementById("meta").textContent = "ยังไม่มี report — รัน scripts/collect_report.py ก่อน";
        return;
      }
      report = await res.json();
      document.getElementById("meta").textContent =
        `month ${report.month} · generated ${new Date(report.generated_at).toLocaleString()} · ${report.rows.length} people`;
      renderRows();
      renderTickets();
      renderPRs();
    }

    async function boot() {
      const monthSelect = document.getElementById("month");
      let months = [{ label: "เดือนล่าสุด", file: "report.json" }];
      const index = await fetch("/data/months.json", { cache: "no-store" });
      if (index.ok) months = await index.json();
      monthSelect.innerHTML = months.map(m => `<option value="${escapeHtml(m.file)}">${escapeHtml(m.label)}</option>`).join("");
      monthSelect.addEventListener("change", e => loadReport(e.target.value));
      document.getElementById("q").addEventListener("input", e => renderRows(e.target.value));
      document.querySelectorAll(".filters input").forEach(input => input.addEventListener("change", () => {
        renderRows(document.getElementById("q").value);
        updateColumnVisibility();
      }));
      updateColumnVisibility();
      await loadReport(months[0].file);
      document.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (sortKey === key) sortDirection *= -1;
        else { sortKey = key; sortDirection = 1; }
        document.querySelectorAll("th.sortable").forEach(h => h.classList.remove("asc", "desc"));
        th.classList.add(sortDirection === 1 ? "asc" : "desc");
        renderRows(document.getElementById("q").value);
      }));
    }
    boot();
  </script>
</body>
</html>
